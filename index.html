<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Nghe Truyện Audio</title>
    <style>
        :root {
            --bg-color: #121212; --surface-color: #1e1e1e;
            --primary-color: #ff9800; --text-color: #e0e0e0;
            --text-muted: #9e9e9e; --border-color: #333;
            --highlight-bg: #4a2e00; --highlight-color: #ffb74d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); overflow-x: hidden; }
        
        /* Loading & Auth Screen */
        #authScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-box {
            background: var(--surface-color); padding: 30px; border-radius: 12px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 90%; max-width: 350px;
        }
        .auth-box h2 { margin-bottom: 20px; color: var(--primary-color); }
        .auth-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
            border: 1px solid var(--border-color); background: var(--bg-color); color: white;
            font-size: 16px; outline: none;
        }
        .auth-box button {
            width: 100%; padding: 12px; background: var(--primary-color);
            color: #000; border: none; border-radius: 6px; font-weight: bold;
            font-size: 16px; cursor: pointer;
        }
        
        /* App Layout */
        #appContainer { display: none; height: 100vh; flex-direction: column; }
        
        /* Header */
        header {
            background: var(--surface-color); padding: 15px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
        }
        header button, header select {
            background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color);
            padding: 8px 12px; border-radius: 6px; cursor: pointer; outline: none;
        }
        
        /* Main Content */
        main { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        .story-title { font-size: 22px; color: var(--primary-color); margin-bottom: 5px; }
        .chapter-title { font-size: 18px; color: var(--text-muted); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .story-paragraph { margin-bottom: 15px; line-height: 1.8; font-size: 18px; text-align: justify; }
        .sentence { cursor: pointer; padding: 2px 0; border-radius: 3px; transition: background 0.2s; }
        .sentence:hover { background: #333; }
        .sentence.active { background: var(--highlight-bg); color: var(--highlight-color); font-weight: bold; }
        
        /* Bottom Player Bar */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface-color);
            border-top: 1px solid var(--border-color); padding: 10px 15px; display: flex;
            flex-direction: column; gap: 8px; z-index: 1000;
        }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
        .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .controls button {
            background: var(--primary-color); color: #000; border: none;
            padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;
        }
        .controls select { flex: 1; padding: 10px; border-radius: 6px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
        
        /* Menu Modal */
        #menuModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: var(--surface-color); width: 90%; max-width: 400px; max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; font-weight: bold; }
        .modal-body { overflow-y: auto; padding: 15px; }
        .menu-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .menu-item:hover { background: var(--bg-color); color: var(--primary-color); }
        .close-btn { cursor: pointer; color: var(--primary-color); }
        
        /* Toast Notification */
        #toast { position: fixed; top: 20px; right: 20px; background: var(--primary-color); color: #000; padding: 10px 20px; border-radius: 6px; font-weight: bold; display: none; z-index: 3000; }
    </style>
</head>
<body>

    <!-- Loading & Auth -->
    <div id="authScreen">
        <div class="auth-box">
            <h2>Mở Khóa Website</h2>
            <input type="password" id="txtPassword" placeholder="Nhập mã khóa (Mothaiba@123)" />
            <button id="btnLogin">Truy Cập</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer">
        <header>
            <button id="btnMenu">Mục Lục (Truyện & Chương)</button>
            <button id="btnBookmark">⭐ Đánh Dấu</button>
        </header>

        <main id="storyContainer">
            <div class="story-title" id="lblStoryTitle">Tên Truyện</div>
            <div class="chapter-title" id="lblChapterTitle">Chương X</div>
            <div id="contentArea"></div>
        </main>

        <div class="bottom-bar">
            <div class="progress-info">
                <span id="lblChapterProgress">Chương: --/--</span>
                <span id="lblSentenceProgress">Câu: --/--</span>
            </div>
            <div class="controls">
                <button id="btnPrev">⏮ Chương Trước</button>
                <button id="btnPlayPause">▶ Phát Đọc</button>
                <button id="btnNext">⏭ Chương Sau</button>
                <select id="selSpeed">
                    <option value="0.75">Tốc độ: 0.75x</option>
                    <option value="1" selected>Tốc độ: 1.0x</option>
                    <option value="1.25">Tốc độ: 1.25x</option>
                    <option value="1.5">Tốc độ: 1.5x</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Menu Modal -->
    <div id="menuModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Mục Lục</span>
                <span class="close-btn" onclick="document.getElementById('menuModal').style.display='none'">✖ Đóng</span>
            </div>
            <div class="modal-body" id="menuList"></div>
        </div>
    </div>

    <div id="toast">Thông báo</div>

    <script>
        // DOM Proxy for clean element selection
        const dom = new Proxy({}, { get: (target, id) => document.getElementById(id) });

        // App State
        const state = {
            password: 'Mothaiba@123',
            stories: [],
            cStory: 0,
            cChapter: 0,
            cSentence: 0,
            sentences: [],
            isPlaying: false,
            audioPlayer: new Audio(),
            speechSynth: window.speechSynthesis,
            bookmarks: JSON.parse(localStorage.getItem('bookmarks') || '{}')
        };

        // 1. Authentication
        dom.btnLogin.onclick = () => {
            if (dom.txtPassword.value === state.password) {
                dom.authScreen.style.display = 'none';
                dom.appContainer.style.display = 'flex';
                loadData();
            } else {
                showToast("Sai mã khóa! Vui lòng thử lại.");
                dom.txtPassword.value = '';
            }
        };

        dom.txtPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') dom.btnLogin.click();
        });

        // 2. Load JSON Data
        async function loadData() {
            try {
                const res = await fetch('data/stories.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error("HTTP error " + res.status);
                state.stories = await res.json();
                
                if (state.stories.length > 0) {
                    showToast("Đã nạp dữ liệu truyện thành công!");
                    loadChapter(0, 0);
                } else {
                    showToast("Tệp JSON rỗng.");
                }
            } catch (err) {
                console.error(err);
                showToast("Lỗi tải data/stories.json! Hãy kiểm tra lại tệp.");
            }
        }

        // 3. Render Chapter
        function loadChapter(sIdx, cIdx) {
            if (sIdx < 0 || sIdx >= state.stories.length) return;
            const story = state.stories[sIdx];
            if (cIdx < 0 || cIdx >= story.chapters.length) return;

            state.cStory = sIdx;
            state.cChapter = cIdx;
            state.cSentence = 0;
            state.sentences = [];

            dom.lblStoryTitle.innerText = story.title;
            dom.lblChapterTitle.innerText = story.chapters[cIdx].title;
            dom.lblChapterProgress.innerText = `Chương: ${cIdx + 1}/${story.chapters.length}`;

            // Parse content into paragraphs and sentences
            const rawText = story.chapters[cIdx].content;
            const paragraphs = rawText.split('\n').filter(p => p.trim() !== '');
            
            dom.contentArea.innerHTML = '';
            let sentenceGlobalIdx = 0;

            paragraphs.forEach(paraText => {
                const pEl = document.createElement('p');
                pEl.className = 'story-paragraph';
                
                // Simple regex to split sentences safely
                const sentenceMatches = paraText.match(/[^.!?]+[.!?]+/g) || [paraText];
                
                sentenceMatches.forEach(senText => {
                    const cleanSen = senText.trim();
                    if (!cleanSen) return;
                    
                    const spanEl = document.createElement('span');
                    spanEl.className = 'sentence';
                    spanEl.innerText = cleanSen + ' ';
                    spanEl.dataset.idx = sentenceGlobalIdx;
                    
                    // Click to play from this sentence
                    spanEl.onclick = () => {
                        state.cSentence = parseInt(spanEl.dataset.idx);
                        if(state.isPlaying) stopAudio();
                        updateHighlight();
                        playAudio();
                    };

                    pEl.appendChild(spanEl);
                    state.sentences.push({ text: cleanSen, element: spanEl });
                    sentenceGlobalIdx++;
                });
                dom.contentArea.appendChild(pEl);
            });

            updateHighlight();
            if (state.isPlaying) playAudio();
        }

        // 4. Highlight & Progress update
        function updateHighlight() {
            state.sentences.forEach((s, idx) => {
                if (idx === state.cSentence) {
                    s.element.classList.add('active');
                    s.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    s.element.classList.remove('active');
                }
            });
            dom.lblSentenceProgress.innerText = `Câu: ${state.cSentence + 1}/${state.sentences.length}`;
        }

        // 5. Audio Playback (Google Translate TTS / Browser TTS)
        function playAudio() {
            if (state.sentences.length === 0 || state.cSentence >= state.sentences.length) {
                // Auto next chapter
                if (state.cChapter < state.stories[state.cStory].chapters.length - 1) {
                    loadChapter(state.cStory, state.cChapter + 1);
                } else {
                    stopAudio();
                    showToast("Đã hết truyện!");
                }
                return;
            }

            state.isPlaying = true;
            dom.btnPlayPause.innerText = '⏸ Tạm Dừng';
            updateHighlight();

            const textToRead = state.sentences[state.cSentence].text;
            const speed = parseFloat(dom.selSpeed.value);

            // Attempt to use Google Translate API (Unofficial TTS fallback)
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&ttsspeed=${speed}&q=${encodeURIComponent(textToRead)}`;
            
            state.audioPlayer.src = url;
            state.audioPlayer.playbackRate = speed;
            
            state.audioPlayer.play().catch(e => {
                console.log("Mạng hoặc CORS chặn Audio, chuyển sang bộ đọc hệ thống", e);
                // Fallback to Web Speech API
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'vi-VN';
                utterance.rate = speed;
                utterance.onend = () => nextSentence();
                state.speechSynth.speak(utterance);
            });

            state.audioPlayer.onended = () => nextSentence();
        }

        function nextSentence() {
            state.cSentence++;
            if (state.isPlaying) playAudio();
        }

        function stopAudio() {
            state.isPlaying = false;
            dom.btnPlayPause.innerText = '▶ Phát Đọc';
            state.audioPlayer.pause();
            state.speechSynth.cancel();
        }

        // 6. Controls
        dom.btnPlayPause.onclick = () => {
            if (state.isPlaying) stopAudio();
            else playAudio();
        };

        dom.btnPrev.onclick = () => {
            if (state.cChapter > 0) loadChapter(state.cStory, state.cChapter - 1);
            else showToast("Đây là chương đầu tiên!");
        };

        dom.btnNext.onclick = () => {
            if (state.cChapter < state.stories[state.cStory].chapters.length - 1) {
                loadChapter(state.cStory, state.cChapter + 1);
            } else {
                showToast("Đã hết chương!");
            }
        };

        dom.selSpeed.onchange = () => {
            if (state.isPlaying) { stopAudio(); playAudio(); }
        };

        // 7. Menus & Bookmarks
        dom.btnMenu.onclick = () => {
            dom.menuList.innerHTML = '';
            state.stories.forEach((story, sIdx) => {
                const sDiv = document.createElement('div');
                sDiv.innerHTML = `<strong>📖 ${story.title}</strong>`;
                sDiv.style.padding = "10px"; sDiv.style.background = "var(--bg-color)";
                dom.menuList.appendChild(sDiv);

                story.chapters.forEach((chap, cIdx) => {
                    const cDiv = document.createElement('div');
                    cDiv.className = 'menu-item';
                    cDiv.innerText = `  ↳ ${chap.title}`;
                    cDiv.onclick = () => {
                        dom.menuModal.style.display = 'none';
                        stopAudio();
                        loadChapter(sIdx, cIdx);
                    };
                    dom.menuList.appendChild(cDiv);
                });
            });
            dom.menuModal.style.display = 'flex';
        };

        dom.btnBookmark.onclick = () => {
            const bmKey = `${state.cStory}_${state.cChapter}`;
            state.bookmarks[bmKey] = {
                storyTitle: state.stories[state.cStory].title,
                chapterTitle: state.stories[state.cStory].chapters[state.cChapter].title,
                sentenceIdx: state.cSentence
            };
            localStorage.setItem('bookmarks', JSON.stringify(state.bookmarks));
            showToast("Đã lưu vị trí chương hiện tại!");
        };

        // Utilities
        function showToast(msg) {
            dom.toast.innerText = msg;
            dom.toast.style.display = 'block';
            setTimeout(() => { dom.toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
